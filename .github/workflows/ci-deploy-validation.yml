name: CI - Deployment Config Validation

on:
  pull_request:
    paths:
      - "Deployment/**"
      - "Shared/Deterministic/**"
      - "Shared/Telemetry/**"
      - "Shared/Authorization/**"
      - ".github/workflows/ci-deploy-validation.yml"
      - "tools/validate-manifest.sh"
  push:
    branches: [main]
    paths:
      - "Deployment/**"
      - "Shared/Deterministic/**"
      - "Shared/Telemetry/**"
      - "Shared/Authorization/**"
      - ".github/workflows/ci-deploy-validation.yml"
      - "tools/validate-manifest.sh"

jobs:
  build-test-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Deployment
        run: dotnet build Deployment/Deployment.csproj -c Release

      - name: Build Deployment.Tests
        run: dotnet build Deployment/Tests/Deployment.Tests.csproj -c Release

      - name: Build ManifestValidator
        run: dotnet build Deployment/Tools/ManifestValidator/ManifestValidator.csproj -c Release

      - name: Build DeterministicSerializer
        run: dotnet build Deployment/Tools/DeterministicSerializer/DeterministicSerializer.csproj -c Release

      - name: Run unit tests (Category=Unit)
        run: dotnet run --project Deployment/Tests/Deployment.Tests.csproj -c Release --no-build -- -trait "Category=Unit"

      - name: Run integration tests (Category=Integration)
        run: dotnet run --project Deployment/Tests/Deployment.Tests.csproj -c Release --no-build -- -trait "Category=Integration"

      - name: Validate sample manifests against ConfigValidator
        run: |
          dotnet run --project Deployment/Tools/ManifestValidator/ManifestValidator.csproj -c Release --no-build -- \
            Deployment/ConfigSchema/SampleManifests/shared-topology-tenant.json \
            Deployment/ConfigSchema/SampleManifests/isolated-topology-tenant.json \
            Deployment/ConfigSchema/SampleManifests/canary-deployment.json

      - name: Deterministic serialization round-trip check
        run: |
          set -euo pipefail
          for manifest in Deployment/ConfigSchema/SampleManifests/*.json; do
            dotnet run --project Deployment/Tools/DeterministicSerializer/DeterministicSerializer.csproj -c Release --no-build -- "$manifest" > /tmp/run1.json
            dotnet run --project Deployment/Tools/DeterministicSerializer/DeterministicSerializer.csproj -c Release --no-build -- "$manifest" > /tmp/run2.json
            if ! cmp -s /tmp/run1.json /tmp/run2.json; then
              echo "::error::Non-deterministic serialization for $manifest"
              diff /tmp/run1.json /tmp/run2.json
              exit 1
            fi
            echo "Deterministic: $manifest"
          done
